name: Build & Release APK

# ── Triggers ────────────────────────────────────────────────────────────────
# Push a tag like  v1.0  or  v1.2.3  to build + publish a GitHub Release.
# Dispatch manually from the Actions tab to build a one-off debug APK.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

# ── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create a GitHub Release

# ── Job ──────────────────────────────────────────────────────────────────────
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17 (required by AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Install Gradle 8.4 (also makes `gradle` available on PATH)
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 4. Generate gradlew + gradle-wrapper.jar from the installed Gradle
      #    (repo only ships gradle-wrapper.properties; this produces the rest)
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      # 6. Determine whether we are doing a release build
      - name: Decide build type
        id: btype
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          else
            echo "type=${{ inputs.build_type || 'debug' }}" >> $GITHUB_OUTPUT
          fi

      # 7. Set up signing keystore
      #    If KEYSTORE_BASE64 secret exists → use it (proper release signing).
      #    Otherwise → generate a throwaway self-signed keystore (debug / test).
      - name: Prepare keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository signing keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.ks"
            echo "path=$RUNNER_TEMP/release.ks"            >> $GITHUB_OUTPUT
            echo "password=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "alias=${{ secrets.KEY_ALIAS }}"            >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.KEY_PASSWORD }}"  >> $GITHUB_OUTPUT
          else
            echo "No keystore secret found — generating a throwaway keystore"
            keytool -genkey -v \
              -keystore "$RUNNER_TEMP/ci.ks" \
              -alias igredirect \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=IGRedirect CI, O=CI, C=US" \
              -storepass android123 -keypass android123 -noprompt
            echo "path=$RUNNER_TEMP/ci.ks"  >> $GITHUB_OUTPUT
            echo "password=android123"       >> $GITHUB_OUTPUT
            echo "alias=igredirect"          >> $GITHUB_OUTPUT
            echo "key_password=android123"   >> $GITHUB_OUTPUT
          fi

      # 8. Build the APK
      - name: Build APK
        env:
          KEYSTORE_PATH:     ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.ks.outputs.password }}
          KEY_ALIAS:         ${{ steps.ks.outputs.alias }}
          KEY_PASSWORD:      ${{ steps.ks.outputs.key_password }}
        run: |
          if [ "${{ steps.btype.outputs.type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # 9. Locate the built APK and give it a friendly name
      - name: Rename APK
        id: apk
        run: |
          TYPE="${{ steps.btype.outputs.type }}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG:-ci}"
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -1)
          DEST="IGRedirect-${VERSION}-${TYPE}.apk"
          cp "$SRC" "$DEST"
          echo "file=$DEST" >> $GITHUB_OUTPUT
          echo "Built: $DEST"

      # 10. Upload APK as a workflow artifact (always, every run)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      # 11. Create a GitHub Release (only when triggered by a tag push)
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: IGRedirect ${{ github.ref_name }}
          body: |
            ## IGRedirect ${{ github.ref_name }}

            Intercepts Instagram links from any app and redirects them
            to your chosen Kittygram frontend.

            ### Install
            1. Download `IGRedirect-*.apk` below.
            2. Enable *Install from unknown sources* for your file manager.
            3. Tap the APK to install.
            4. Click an Instagram link → select **IGRedirect** → optionally tap **Always**.

            ### Signing note
            ${{ secrets.KEYSTORE_BASE64 != '' && 'Signed with the repository release keystore.' || 'Signed with a CI-generated throwaway keystore (not for distribution via app stores).' }}
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
